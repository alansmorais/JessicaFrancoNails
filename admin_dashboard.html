<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Jéssica Franco</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { dark: '#262d3a', active: '#3b82f6', bg: '#f4f6f8', blue: '#4c8ee8', red: '#f66d6d', green: '#34b484', yellow: '#f4ad42', purple: '#9b66d9' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .cal-grid {
            display: grid;
            grid-template-columns: 50px repeat(6, 1fr);
            border-top: 1px solid #e5e7eb;
            border-left: 1px solid #e5e7eb;
        }
        @media(min-width: 768px) { .cal-grid { grid-template-columns: 60px repeat(6, 1fr); } }
        
        .cal-cell {
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            height: 70px; 
            position: relative;
        }
        @media(min-width: 768px) { .cal-cell { height: 80px; } }
        
        .cal-header {
            background-color: #ffffff;
            text-align: center;
            padding: 8px 0;
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }
        .cal-time { font-size: 0.70rem; color: #9ca3af; text-align: center; transform: translateY(-50%); display: block; }
        
        .event-pill {
            position: absolute;
            left: 2px; right: 2px; top: 4px; bottom: 4px;
            border-radius: 6px; padding: 4px;
            color: white; font-size: 0.70rem; font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 10;
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start;
        }
        @media(min-width: 768px) { .event-pill { left: 4px; right: 4px; padding: 6px 8px; font-size: 0.75rem; } }
    </style>
</head>
<body class="bg-brand-bg text-gray-800 font-sans h-screen flex overflow-hidden">

    <div id="login-screen" class="fixed inset-0 bg-brand-dark flex flex-col items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center w-11/12 max-w-sm">
            <div class="w-16 h-16 bg-blue-50 text-brand-active rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="lock" class="w-8 h-8"></i></div>
            <h2 class="text-brand-dark font-bold text-2xl mb-2">Acesso Restrito</h2>
            <form id="loginForm">
                <input type="password" id="adminPwd" placeholder="Palavra-passe" required class="w-full p-4 rounded-xl border border-gray-200 mb-5 text-center text-lg outline-none focus:border-brand-active focus:ring-2 focus:ring-blue-100 transition">
                <button type="submit" id="btnLogin" class="w-full bg-brand-active text-white font-bold p-4 rounded-xl hover:bg-blue-600 transition shadow-lg shadow-blue-500/30">Entrar no Painel</button>
            </form>
        </div>
    </div>

    <aside class="w-64 bg-brand-dark text-gray-300 flex flex-col hidden md:flex z-20 shadow-xl">
        <div class="h-16 flex items-center px-6 border-b border-gray-700/50 bg-gray-900/20">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-active to-blue-400 text-white flex items-center justify-center font-bold text-lg mr-3 shadow-lg">JF</div>
            <div><h1 class="text-white font-semibold text-sm">Painel de Gestão</h1><span class="text-xs text-gray-400">Jéssica Franco</span></div>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
            <button onclick="switchTab('dashboard', this)" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl bg-brand-active text-white transition text-sm font-medium shadow-md shadow-blue-500/20"><i data-lucide="calendar-days" class="w-5 h-5"></i> Agendamentos</button>
            <button onclick="switchTab('cursos', this)" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-gray-800 transition text-sm text-left"><i data-lucide="graduation-cap" class="w-5 h-5"></i> Cursos</button>
            <button onclick="switchTab('financeiro', this)" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-gray-800 transition text-sm text-left"><i data-lucide="dollar-sign" class="w-5 h-5"></i> Financeiro</button>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white flex items-center justify-between px-4 lg:px-8 border-b border-gray-200 z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <button class="md:hidden p-2 text-gray-500 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <h2 class="text-xl font-bold text-gray-800 hidden sm:block">Dashboard</h2>
                <div id="sync-status" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-50 text-green-700 text-xs font-bold border border-green-100">Sincronizado</div>
            </div>
            <div class="flex items-center gap-4 text-gray-500">
                <div class="flex items-center gap-3 pl-4 border-l border-gray-200 cursor-pointer">
                    <div class="text-right hidden sm:block"><p class="text-sm font-bold text-gray-800">Jéssica Franco</p><p class="text-xs text-gray-500">Administradora</p></div>
                    <img src="https://ui-avatars.com/api/?name=Jessica+Franco&background=3b82f6&color=fff" class="w-9 h-9 rounded-full border-2 border-white shadow-sm">
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8 bg-brand-bg">
            <div id="tab-dashboard" class="tab-content active">
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
                    <div class="xl:col-span-8 flex flex-col gap-6">
                        
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 lg:p-5">
                            <div class="flex flex-wrap justify-between items-center mb-5 gap-4">
                                <h3 id="calendar-month-title" class="text-lg lg:text-xl font-bold text-gray-800">Mês...</h3>
                                <button onclick="fetchData()" class="p-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                            </div>
                            <div class="overflow-x-auto">
                                <div class="min-w-[500px] md:min-w-[600px]">
                                    <div class="cal-grid bg-gray-50 rounded-t-lg" id="cal-headers"></div>
                                    <div class="cal-grid" id="cal-body"></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 lg:p-6 flex-1 flex flex-col">
                            <h3 class="font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3">Lista Completa</h3>
                            <div id="lista-agendamentos" class="space-y-3 overflow-y-auto max-h-[300px] pr-2"></div>
                        </div>
                    </div>

                    <div class="xl:col-span-4 flex flex-col gap-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 lg:p-5">
                                <span class="text-xs font-semibold text-gray-500">Total Marcações</span>
                                <strong id="stat-agendamentos" class="block text-2xl lg:text-3xl font-black mt-1">0</strong>
                            </div>
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 lg:p-5">
                                <span class="text-xs font-semibold text-gray-500">Receita Prevista</span>
                                <strong id="stat-receita" class="block text-xl font-black mt-1">R$ 0,00</strong>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 lg:p-6 flex-1">
                            <h3 class="font-bold text-gray-800 mb-5 border-b border-gray-100 pb-3">Clientes Ativos</h3>
                            <div id="lista-clientes" class="space-y-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CURSOS -->
            <div id="tab-cursos" class="tab-content"><div class="bg-white rounded-2xl p-6"><h3 class="text-xl font-bold mb-6">Inscrições</h3><div id="lista-cursos" class="space-y-3"></div></div></div>
            <!-- FINANCEIRO -->
            <div id="tab-financeiro" class="tab-content">
                <div class="bg-white rounded-2xl p-6 mb-6">
                    <h3 class="text-xl font-bold mb-6">Registo Financeiro</h3>
                    <form id="financeForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <input type="date" id="finDate" required class="p-3 border rounded-xl"><select id="finCat" required class="p-3 border rounded-xl"><option value="Entrada">Entrada</option><option value="Saida">Saída (Custo)</option></select><input type="number" id="finValue" placeholder="Valor" required step="0.01" class="p-3 border rounded-xl"><input type="text" id="finDesc" placeholder="Descrição" required class="p-3 border rounded-xl md:col-span-2"><button type="submit" id="btnFin" class="md:col-span-5 bg-brand-active text-white font-bold p-3 rounded-xl">Registar Transação</button>
                    </form>
                </div>
                <div class="bg-white rounded-2xl p-6"><h3 class="font-bold mb-4">Histórico</h3><div id="lista-financeiro" class="space-y-3"></div></div>
            </div>
        </main>
    </div>

    <script>lucide.createIcons();</script>
    <script>
        // ==========================================
        // URL JÁ CONFIGURADA
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjfkPPxDEr469YEcJQ2121sFDULAszG9_7NzyYcFsNNTiqtiTSFkpKh42gvtcFGsLS1w/exec";
        
        let lastTotalItems = -1;
        function playLoudNotification() { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.5); gain.gain.setValueAtTime(1, ctx.currentTime); osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1.2); osc.stop(ctx.currentTime + 1.2); }

        document.getElementById('loginForm').onsubmit = async function(e) {
            e.preventDefault(); const pwd = document.getElementById('adminPwd').value; const btn = document.getElementById('btnLogin');
            btn.innerHTML = `A validar...`;
            try {
                const res = await fetch(WEB_APP_URL + "?action=login&pwd=" + encodeURIComponent(pwd)); const json = await res.json();
                if(json.status === "success") { document.getElementById('login-screen').style.display = 'none'; try{playLoudNotification();}catch(e){} fetchData(); setInterval(fetchData, 20000); } 
                else { alert('Palavra-passe incorreta!'); btn.innerHTML = `Entrar no Painel`; }
            } catch(e) { alert('Erro na ligação.'); btn.innerHTML = `Entrar no Painel`; }
        };

        function switchTab(tabId, el) {
            document.querySelectorAll('.nav-item').forEach(n => { n.classList.remove('bg-brand-active', 'text-white', 'shadow-md'); n.classList.add('hover:bg-gray-800', 'text-gray-300'); });
            el.classList.remove('hover:bg-gray-800', 'text-gray-300'); el.classList.add('bg-brand-active', 'text-white', 'shadow-md');
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active')); document.getElementById('tab-' + tabId).classList.add('active');
        }

        // ==========================================
        // CALENDÁRIO COM 4 BLOCOS
        // ==========================================
        const workHours = ['09:00','11:30','14:00','16:30'];
        const dayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        
        function getWeekDates() {
            let curr = new Date(); let dayOfWeek = curr.getDay(); let diff = curr.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            let monday = new Date(curr.setDate(diff)); let week = [];
            for (let i = 0; i < 6; i++) { let nextDay = new Date(monday); nextDay.setDate(monday.getDate() + i); week.push(nextDay); }
            return week;
        }

        function toLocalISOString(date) { const d = new Date(date); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split('T')[0]; }
        function getColorForService(service) { const s = String(service).toLowerCase(); if(s.includes("alongamento")) return "bg-brand-purple"; if(s.includes("banho")) return "bg-brand-blue"; if(s.includes("blindagem")) return "bg-brand-red"; return "bg-brand-green"; }

        function renderDynamicCalendar(bookings) {
            const weekDates = getWeekDates();
            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            document.getElementById('calendar-month-title').innerText = `${monthNames[weekDates[0].getMonth()]} ${weekDates[0].getFullYear()}`;

            let headersHTML = `<div class="cal-header border-t border-e border-gray-200"></div>`;
            const todayStr = toLocalISOString(new Date());

            weekDates.forEach((date, i) => {
                const dateStr = toLocalISOString(date); const dayNum = date.getDate().toString().padStart(2, '0');
                if (dateStr === todayStr) headersHTML += `<div class="cal-header border-t border-gray-200 bg-blue-50"><span class="text-brand-active text-[10px] uppercase block font-bold">${dayNames[i]}</span><span class="text-sm md:text-lg text-brand-active font-bold bg-blue-100 w-6 h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center mx-auto mt-0.5">${dayNum}</span></div>`;
                else headersHTML += `<div class="cal-header border-t border-gray-200"><span class="text-gray-400 text-[10px] uppercase block">${dayNames[i]}</span><span class="text-sm md:text-lg text-gray-800">${dayNum}</span></div>`;
            });
            document.getElementById('cal-headers').innerHTML = headersHTML;

            let bookingMap = {};
            if(bookings) bookings.forEach(b => { bookingMap[`${b['Data Agendamento']}_${b['Hora']}`] = b; });

            let bodyHTML = '';
            workHours.forEach(hour => {
                bodyHTML += `<div class="cal-cell flex items-start justify-center pt-2"><span class="cal-time">${hour}</span></div>`;
                weekDates.forEach((date, index) => {
                    const dateStr = toLocalISOString(date); const b = bookingMap[`${dateStr}_${hour}`];
                    const bgClass = (dateStr === todayStr) ? 'bg-blue-50/20' : '';
                    
                    // Sábado à tarde: Bloqueado
                    if (index === 5 && (hour === '14:00' || hour === '16:30')) {
                        bodyHTML += `<div class="cal-cell bg-gray-100/50 flex items-center justify-center"><span class="text-[10px] text-gray-300">Fechado</span></div>`;
                    }
                    else if (b && b['Status'] !== 'Cancelado') {
                        const initials = String(b['Cliente']).substring(0,2).toUpperCase();
                        bodyHTML += `<div class="cal-cell ${bgClass}"><div class="event-pill ${getColorForService(b['Servico'])} hover:opacity-90" title="${b['Cliente']} - ${b['Servico']}"><div class="font-bold text-[10px] md:text-xs opacity-90">${initials}</div><div class="truncate text-[9px] md:text-[11px] mt-1 hidden sm:block">${b['Servico']}</div></div></div>`;
                    } else {
                        bodyHTML += `<div class="cal-cell ${bgClass}"></div>`;
                    }
                });
            });
            document.getElementById('cal-body').innerHTML = bodyHTML;
        }

        async function fetchData() {
            const syncUI = document.getElementById('sync-status'); syncUI.innerText = "A atualizar...";
            try {
                const res = await fetch(WEB_APP_URL + "?action=get_all"); const data = await res.json();
                
                if (data.bookings) {
                    data.bookings = data.bookings.map(b => {
                        let dataStr = String(b['Data Agendamento']); if (dataStr.includes('T')) b['Data Agendamento'] = dataStr.split('T')[0];
                        let horaStr = String(b['Hora']); let timeMatch = horaStr.match(/\d{1,2}:\d{2}/); if (timeMatch) b['Hora'] = timeMatch[0]; 
                        return b;
                    });
                }
                
                const currentTotalItems = (data.bookings ? data.bookings.length : 0) + (data.courses ? data.courses.length : 0);
                if (lastTotalItems !== -1 && currentTotalItems > lastTotalItems) { playLoudNotification(); alert("🔔 NOVA MARCAÇÃO!"); }
                lastTotalItems = currentTotalItems;

                renderDynamicCalendar(data.bookings);

                const bookingsList = document.getElementById('lista-agendamentos');
                if(!data.bookings || data.bookings.length === 0) bookingsList.innerHTML = `<div class="text-center py-5 text-gray-400">Nenhum registo.</div>`;
                else bookingsList.innerHTML = data.bookings.reverse().map(b => {
                    const isConfirmed = b['Status'] === 'Confirmado'; const statusColor = isConfirmed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                    return `<div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition bg-white gap-4"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-blue-50 text-brand-active flex items-center justify-center font-bold border border-blue-100"><span class="text-sm">${b['Hora']}</span></div><div><h4 class="font-bold text-gray-800 text-sm md:text-lg">${b['Cliente']}</h4><p class="text-xs text-gray-500 mt-1">${b['Servico']} · ${b['Telefone']}</p></div></div><div class="flex flex-col items-end gap-1"><span class="px-2 py-1 rounded-full text-[10px] md:text-xs font-bold ${statusColor}">${b['Status']}</span><span class="text-[10px] text-gray-400">${b['Data Agendamento']}</span></div></div>`;
                }).join('');

                document.getElementById('stat-agendamentos').innerText = data.bookings ? data.bookings.length : 0;
                let receita = 0; const clientesMap = new Map();
                if(data.bookings) data.bookings.forEach(b => { if(b['Status'] === 'Confirmado' && b['Valor']) receita += Number(b['Valor']); if(!clientesMap.has(b['Telefone'])) clientesMap.set(b['Telefone'], b['Cliente']); });
                document.getElementById('stat-receita').innerText = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(receita);
                document.getElementById('lista-clientes').innerHTML = Array.from(clientesMap, ([phone, name]) => ({phone, name})).slice(0,5).map(c => `<div class="flex items-center justify-between p-2"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-600">${String(c.name).substring(0,2).toUpperCase()}</div><div><p class="text-sm font-bold">${c.name}</p><p class="text-xs text-gray-400">${c.phone}</p></div></div></div>`).join('');
                syncUI.innerText = "Sincronizado";
            } catch (error) { syncUI.innerText = "Erro de Ligação"; }
        }
        
        document.getElementById('finDate').value = new Date().toISOString().slice(0,10);
    </script>
</body>
</html>
